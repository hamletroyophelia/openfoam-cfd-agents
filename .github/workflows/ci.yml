name: Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m build
      - name: Install and exercise wheel in a fresh environment
        shell: pwsh
        run: |
          python -m venv wheel-test
          $wheelPython = if ($IsWindows) { 'wheel-test/Scripts/python.exe' } else { 'wheel-test/bin/python' }
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          & $wheelPython -m pip install $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -m openfoam_cfd_agents.cli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -m openfoam_cfd_agents.cli validate-config config/default.yaml
          exit $LASTEXITCODE

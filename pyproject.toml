[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openfoam-cfd-agents"
version = "0.1.0"
description = "Auditable multi-agent workflow foundations for OpenFOAM CFD simulations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "OpenFOAM CFD Agents contributors" }]
keywords = ["openfoam", "cfd", "verification", "mcp", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
cfd-workflow = "openfoam_cfd_agents.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openfoam_cfd_agents"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["openfoam_cfd_agents"]
